<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gearBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7B8594" />
      <stop offset="100%" stop-color="#4B5361" />
    </linearGradient>
    <linearGradient id="gearSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2F4F7" />
      <stop offset="50%" stop-color="#C5CBD3" />
      <stop offset="100%" stop-color="#939AA5" />
    </linearGradient>
    <linearGradient id="gearGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <filter id="gearShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#gearBg)" stroke="rgba(255,255,255,0.25)" stroke-width="1" />

  <!-- Subtle circular groove -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="4" />

  <!-- Main Large Gear -->
  <g filter="url(#gearShadow)" transform="translate(32, 32)">
    <!-- 8 gear teeth -->
    <path d="M-5 -21 L5 -21 L4 -16 L-4 -16 Z" fill="url(#gearSilver)" />
    <path d="M-5 -21 L5 -21 L4 -16 L-4 -16 Z" transform="rotate(45)" fill="url(#gearSilver)" />
    <path d="M-5 -21 L5 -21 L4 -16 L-4 -16 Z" transform="rotate(90)" fill="url(#gearSilver)" />
    <path d="M-5 -21 L5 -21 L4 -16 L-4 -16 Z" transform="rotate(135)" fill="url(#gearSilver)" />
    <path d="M-5 -21 L5 -21 L4 -16 L-4 -16 Z" transform="rotate(180)" fill="url(#gearSilver)" />
    <path d="M-5 -21 L5 -21 L4 -16 L-4 -16 Z" transform="rotate(225)" fill="url(#gearSilver)" />
    <path d="M-5 -21 L5 -21 L4 -16 L-4 -16 Z" transform="rotate(270)" fill="url(#gearSilver)" />
    <path d="M-5 -21 L5 -21 L4 -16 L-4 -16 Z" transform="rotate(315)" fill="url(#gearSilver)" />

    <!-- Central Gear body -->
    <circle cx="0" cy="0" r="17" fill="url(#gearSilver)" stroke="rgba(255,255,255,0.3)" stroke-width="1" />
    <!-- Gear center hole -->
    <circle cx="0" cy="0" r="7.5" fill="#3D4450" stroke="#2D333D" stroke-width="1.5" />
    <circle cx="0" cy="0" r="4" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
  </g>

  <!-- Top Gloss Highlight -->
  <path d="M2 16 C2 8.27 8.27 2 16 2 L48 2 C55.73 2 62 8.27 62 16 L62 26 C45 20 19 20 2 26 Z" fill="url(#gearGloss)" />
</svg>
