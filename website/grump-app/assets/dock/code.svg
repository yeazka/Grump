<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="codeBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E232E" />
      <stop offset="100%" stop-color="#0E121A" />
    </linearGradient>
    <linearGradient id="blueRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007ACC" />
      <stop offset="100%" stop-color="#005A9E" />
    </linearGradient>
    <linearGradient id="cyanRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#29B6F6" />
      <stop offset="100%" stop-color="#0288D1" />
    </linearGradient>
    <linearGradient id="darkRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004D80" />
      <stop offset="100%" stop-color="#003355" />
    </linearGradient>
    <filter id="codeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#codeBg)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />

  <!-- Origami VS Code Geometry -->
  <g filter="url(#codeShadow)" transform="translate(10, 10)">
    <!-- Back wing -->
    <path d="M31.5 1.5 L12 16.5 L7.5 13 L31.5 1.5 Z" fill="url(#darkRibbon)" opacity="0.8" />
    <path d="M31.5 42.5 L12 27.5 L7.5 31 L31.5 42.5 Z" fill="url(#darkRibbon)" opacity="0.8" />

    <!-- Left chevron beak -->
    <path d="M7.5 13 L1.5 18 L1.5 26 L7.5 31 L15 22 Z" fill="url(#cyanRibbon)" />

    <!-- Top-Right crossing ribbon -->
    <path d="M31.5 1.5 L42.5 7 L12 27.5 L31.5 42.5 Z" fill="url(#blueRibbon)" opacity="0.9" />

    <!-- Main Right ribbon wing -->
    <path d="M42.5 7 L42.5 37 L31.5 42.5 L12 27.5 L42.5 7 Z" fill="url(#cyanRibbon)" />
  </g>
</svg>
