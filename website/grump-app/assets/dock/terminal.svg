<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2C2D30" />
      <stop offset="100%" stop-color="#141517" />
    </linearGradient>
    <linearGradient id="termGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#termBg)" stroke="rgba(255,255,255,0.18)" stroke-width="1" />

  <!-- Terminal Header / Titlebar -->
  <path d="M2 16 C2 8.27 8.27 2 16 2 L48 2 C55.73 2 62 8.27 62 16 L62 18 L2 18 Z" fill="rgba(255,255,255,0.08)" />
  <line x1="2" y1="18" x2="62" y2="18" stroke="rgba(255,255,255,0.06)" stroke-width="1" />

  <!-- Traffic Light Window Dots -->
  <circle cx="10" cy="10" r="2.5" fill="#FF5F56" />
  <circle cx="17" cy="10" r="2.5" fill="#FFBD2E" />
  <circle cx="24" cy="10" r="2.5" fill="#27C93F" />

  <!-- Command Prompt (>_) -->
  <path d="M14 28 L23 35 L14 42" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Blinking Cursor Bar -->
  <line x1="28" y1="42" x2="40" y2="42" stroke="#32D74B" stroke-width="3.5" stroke-linecap="round" />

  <!-- Top Glass Highlight -->
  <path d="M2 16 C2 8.27 8.27 2 16 2 L48 2 C55.73 2 62 8.27 62 16 L62 26 C45 20 19 20 2 26 Z" fill="url(#termGloss)" />
</svg>
