name: Deploy Website to GitHub Pages

on:
  push:
    branches: ["main", "master"]
    paths:
      - "website/**"
      - ".github/workflows/deploy-pages.yml"
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare public website
        run: |
          mkdir -p public-site
          cp website/index.html public-site/
          cp -R website/assets website/grump-app public-site/
          if [ -d website/public ]; then cp -R website/public/. public-site/; fi
          touch public-site/.nojekyll

      - name: Fetch verified download count
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/write-download-stats.cjs public-site/download-stats.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public-site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
